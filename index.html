
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMS RPA Scan</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial;background:#fce7f3;padding:20px;color:#172554}
main{max-width:450px;margin:auto;background:white;padding:20px;border-radius:18px}
button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#172554;color:white;font-size:16px}
textarea{box-sizing:border-box;width:100%;padding:12px}
</style>
</head>
<body>
<main>
<h2>WMS RPA 📦</h2>
<div id="reader"></div>
<textarea id="qr" rows="5" placeholder="Hasil QR"></textarea>
<button id="scan">BUKA KAMERA</button>
<p id="status">Siap scan.</p>
</main>
<script>
const tombol = document.getElementById("scan");
tombol.addEventListener("click", async function(){
 const status = document.getElementById("status");
 status.textContent = "Menyiapkan kamera...";
 tombol.disabled = true;
 try {
  if(typeof Html5Qrcode === "undefined") throw Error("Library scanner gagal dimuat. Periksa internet.");
  const scanner = new Html5Qrcode("reader");
  await scanner.start(
   {facingMode:"environment"},
   {fps:10,qrbox:{width:250,height:250}},
   async teks => {
    document.getElementById("qr").value = teks;
    status.textContent = "QR berhasil dibaca!";
    await scanner.stop();
    tombol.disabled = false;
   }
  );
  status.textContent = "Kamera aktif. Arahkan ke QR.";
 } catch(e) {
  status.textContent = "Gagal: " + e.message;
  tombol.disabled = false;
 }
});
</script>
</body>
</html>
