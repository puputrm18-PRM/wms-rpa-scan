<title>WMS RPA Scan</title>

<script>
let scanner;
async function mulaiScan() {
  const status = document.getElementById("status");
  status.textContent = "Menyiapkan kamera...";
  try {
    if (typeof Html5Qrcode === "undefined") {
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://unpkg.com/html5-qrcode";
        s.onload = resolve;
        s.onerror = () => reject(new Error("Gagal memuat scanner"));
        document.head.appendChild(s);
      });
    }
    if (!scanner) scanner = new Html5Qrcode("reader");
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async hasil => {
        document.getElementById("qr").value = hasil;
        status.textContent = "QR berhasil dibaca!";
        await scanner.stop();
      }
    );
    status.textContent = "Kamera aktif. Arahkan ke QR.";
  } catch (e) {
    status.textContent = "Gagal: " + e.message;
  }
}
function salinQR() {
  const teks = document.getElementById("qr").value;
  if (!teks) {
    document.getElementById("status").textContent = "Scan QR terlebih dahulu.";
    return;
  }
  navigator.clipboard.writeText(teks)
    .then(() => document.getElementById("status").textContent = "QR disalin!")
    .catch(() => document.getElementById("status").textContent = "Gagal menyalin QR.");
}
</script>
